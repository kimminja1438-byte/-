name: Build widget test APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-test.yml'
      - 'taegeuk-calendar-widgets-v2-source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: python -m zipfile -e taegeuk-calendar-widgets-v2-source.zip source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: taegeuk-debug-signing-v1

      - name: Prepare Android
        working-directory: source/taegeuk-test
        run: |
          npm install --no-audit --no-fund
          node setup-android.js
          node test-suffix.js

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: source/taegeuk-test/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: taegeuk-calendar-widgets-test-apk
          path: source/taegeuk-test/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
